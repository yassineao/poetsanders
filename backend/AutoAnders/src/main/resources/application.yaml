spring:
  application:
    name: AutoAnders

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 9

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_IMAGE_UPLOAD_REQUEST_SIZE:40MB}
jwt:
  secret: ${SUPABASE_JWT_SECRET}

guest:
  email-prefix: ${GUEST_EMAIL_PREFIX:guest::}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  base-url: ${BASE_URL:https://poetsanders.vercel.app}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  profile-access-token:
    ttl: ${PROFILE_ACCESS_TOKEN_TTL:PT48H}
  appointments:
    cleanup-cron: "${APPOINTMENT_CLEANUP_CRON:0 */15 * * * *}"
    time-zone: ${APPOINTMENT_TIME_ZONE:Europe/Amsterdam}
