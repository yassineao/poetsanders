spring:
  application:
    name: AutoAnders

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 9

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
jwt:
  secret: ${SUPABASE_JWT_SECRET}

guest:
  email-prefix: ${GUEST_EMAIL_PREFIX:guest::}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  base-url: ${BASE_URL:https://poetsanders.vercel.app}
  appointments:
    cleanup-cron: "${APPOINTMENT_CLEANUP_CRON:0 */15 * * * *}"
    time-zone: ${APPOINTMENT_TIME_ZONE:Europe/Amsterdam}
