<app-form-page
            [locale]="locale()"
            [content]="content()"
            [sending]="sending()"
            [sent]="sent()"
            [failed]="failed()"
            [failureMessage]="failureMessage()"
            (submitted)="submit($event)"
            (successClosed)="sent.set(false)"
            (failureClosed)="failed.set(false)"
            [registering]="registring()"
            (registeringChange)="registring.set($event)"
            [sent_Url]="sent_Url()"
        >
        
</app-form-page>
