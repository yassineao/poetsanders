<app-form-page
    [compactMobile]="true"
    [locale]="locale()"
    [content]="formContent()"
    [sending]="sending()"
    [sent]="sent()"
    [failed]="failed()"
    [failureMessage]="failureMessage()"
    (submitted)="submit($event)"
    (successClosed)="sent.set(false)"
    (failureClosed)="closeFailure()"
/>
