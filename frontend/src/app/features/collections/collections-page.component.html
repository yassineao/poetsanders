<main class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-lg shadow-slate-950/20">
      <h1 class="text-4xl font-semibold tracking-tight text-white">{{ copy().collections.heading }}</h1>
      <p class="mt-4 text-slate-400">
        {{ copy().collections.description }}
      </p>
    </div>

    <section class="mt-12 grid gap-6 lg:grid-cols-2">
      <div *ngFor="let card of copy().collections.cards" class="rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-lg shadow-slate-950/20">
        <h2 class="text-2xl font-semibold text-white">{{ card.title }}</h2>
        <p class="mt-3 text-slate-400">{{ card.body }}</p>
      </div>
    </section>
  </div>
</main>
