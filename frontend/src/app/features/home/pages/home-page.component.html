<main class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative mx-auto lg:min-h-[720px] max-w-full overflow-hidden px-4 sm:px-6 lg:px-8">
    <div class="absolute inset-0 bg-[url('/bg_hero.jpg')] bg-cover bg-center"></div>
    <div
      class="absolute inset-0 bg-gradient-to-br from-slate-950/95 via-slate-950/78 to-cyan-950/70"
    ></div>
    <div
      class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-slate-950 to-transparent"
    ></div>

    <div class="relative z-10">
      <app-first-hero-main [hero]="hero()"></app-first-hero-main>
    </div>
  </div>

  <app-appointments-list />

  <div class="mt-8 sm:mt-12">
    <app-card-main
      [cards]="copy().home.cards"
      [dealershipUrl]="dealershipUrl"
      [dealershipLabel]="copy().navbar.dealership"
      [detailLabel]="copy().services.treatments.detailLinkLabel"
      [beforeLabel]="copy().services.treatments.beforeLabel"
      [afterLabel]="copy().services.treatments.afterLabel"
    />
  </div>

  <app-testimonials-main
    [testimonials]="copy().home.testimonials"
    [maps]="copy().home.maps"
  ></app-testimonials-main>

  <app-faq-main [faq]="copy().faq" />

  <div id="content" class="mx-auto bg-slate-900/90 px-4 py-10 sm:px-6 lg:px-8 sm:py-16">
    <app-hero-main [hero]="hero()"></app-hero-main>
  </div>
  <div id="contact" class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8 sm:py-16">
    <div>
      <app-maps-main [maps]="copy().home.maps"></app-maps-main>
    </div>
  </div>
</main>
