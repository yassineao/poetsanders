<main class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <app-hero-main
      [title]="copy().home.heroHeading"
      [subtitle]="copy().home.heroSubheading"
      [description]="copy().home.description"
      [ctaPrimary]="copy().home.ctaPrimary"
      [ctaSecondary]="copy().home.ctaSecondary"
      primaryLink="#content"
      secondaryLink="#features"
      [features]="copy().home.features"
    ></app-hero-main>

    <section id="features" class="mt-8 grid gap-4 lg:grid-cols-3">
      <article *ngFor="let card of copy().home.cards" class="rounded-3xl border border-white/10 bg-slate-900/70 p-6 shadow-lg shadow-slate-950/20">
        <h2 class="text-xl font-semibold text-white">{{ card.title }}</h2>
        <p class="mt-3 text-slate-400">{{ card.body }}</p>
      </article>
    </section>
  </div>
</main>
