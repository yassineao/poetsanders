<section class="mx-auto max-w-7xl py-14 sm:py-18 lg:py-22">
  <div class="grid items-center gap-10 lg:grid-cols-[minmax(0,1fr)_460px]">
    <div class="max-w-3xl text-center lg:text-left">
      <div class="inline-flex items-center gap-2 rounded-full border border-cyan-200/25 bg-white/10 px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-cyan-100 shadow-lg shadow-black/10 backdrop-blur">
        <span class="h-2 w-2 rounded-full bg-cyan-200"></span>
        {{ hero.eyebrow }}
      </div>
      <h1 class="mt-5 max-w-4xl text-4xl font-semibold leading-tight tracking-tight text-white sm:text-6xl">
        {{ hero.heading }}
      </h1>
      <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-100 lg:text-xl">{{ hero.subheading }}</p>
      <p class="mt-4 max-w-2xl text-sm leading-7 text-slate-300 sm:text-base">{{ hero.description }}</p>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center lg:justify-start">
        <a [href]="hero.primaryLink" class="inline-flex items-center justify-center rounded-md bg-white px-6 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-black/20 transition hover:bg-cyan-100 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">{{ hero.ctaPrimary }}</a>
        <a [href]="hero.secondaryLink" class="inline-flex items-center justify-center rounded-md border border-white/25 bg-white/10 px-6 py-3 text-sm font-semibold text-white backdrop-blur transition hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">{{ hero.ctaSecondary }}</a>
      </div>

      <div class="mt-6 grid gap-3 text-left sm:grid-cols-3">
        <a
          *ngFor="let item of hero.contactItems"
          class="rounded-md border border-white/10 bg-slate-950/55 px-4 py-3 shadow-sm backdrop-blur transition hover:border-cyan-200/35 hover:bg-white/10"
          [href]="item.href || '#content'"
        >
          <span class="block text-xs font-semibold uppercase tracking-[0.16em] text-cyan-200">{{ item.label }}</span>
          <span class="mt-2 block text-sm font-medium leading-6 text-white">{{ item.value }}</span>
        </a>
      </div>

      <!-- <ul class="mt-6 grid gap-3 text-left text-sm text-slate-200 sm:grid-cols-3">
        <li *ngFor="let feature of hero.features" class="rounded-md border border-white/15 bg-white/10 px-4 py-3 shadow-sm backdrop-blur">
          <span class="mb-3 block h-px w-8 bg-cyan-200"></span>
          {{ feature }}
        </li>
      </ul> -->
    </div>

    <div class="rounded-lg border border-white/15 bg-white/10 p-3 shadow-2xl shadow-black/30 backdrop-blur desktop-only">
      <div class="relative aspect-[4/5] overflow-hidden rounded-md bg-slate-900">
        <img class="absolute inset-0 h-full w-full object-cover object-center opacity-65" alt="" [src]="hero.image">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-slate-950/10"></div>

        <div class="absolute inset-x-0 bottom-0 p-5">
          <img src="/logo-poets-website-1_high_resolution.png" alt="Poets Anders" class="mb-5 h-20 w-20 object-contain drop-shadow-2xl">
          <!-- <p class="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-100">{{ hero.reviewLabel }}</p> -->
          <!-- <h2 class="mt-3 text-2xl font-semibold leading-tight text-white">{{ hero.highlightTitle }}</h2>
          <p class="mt-3 text-sm leading-6 text-slate-300">{{ hero.highlightBody }}</p> -->

          <div class="mt-5 flex flex-wrap gap-2">
            <span *ngFor="let service of hero.serviceNames" class="rounded bg-white/10 px-3 py-1 text-xs font-semibold text-white backdrop-blur">
              {{ service }}
            </span>
          </div>
        </div>
      </div>
      <dl class="mt-3 grid grid-cols-3 divide-x divide-white/10 rounded-md bg-slate-950/75 text-center">
        <div *ngFor="let item of hero.trustItems" class="px-3 py-4">
          <dt class="text-lg font-semibold text-white">{{ item.value }}</dt>
          <dd class="mt-1 text-xs leading-5 text-slate-300">{{ item.label }}</dd>
        </div>
      </dl>
    </div>
  </div>
</section>
