<section id="testimonials" class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="grid gap-8 lg:grid-cols-[minmax(0,0.9fr)_minmax(0,1.6fr)] lg:items-end">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.24em] text-cyan-200">{{ testimonials.eyebrow }}</p>
      <h2 class="mt-4 max-w-2xl text-3xl font-semibold leading-tight tracking-tight text-white sm:text-4xl">
        {{ testimonials.heading }}
      </h2>
      <p class="mt-5 max-w-xl leading-7 text-slate-300">{{ testimonials.description }}</p>

      <div
        class="mt-8 inline-flex items-center gap-3 rounded-md border border-cyan-200/20 bg-slate-900/80 px-4 py-3 shadow-lg shadow-slate-950/20">
        <div class="flex text-cyan-200" aria-hidden="true">
          <!-- 4 full stars -->
          <svg *ngFor="let star of [1, 2, 3, 4]" class="h-4 w-4 fill-orange-500" viewBox="0 0 20 20">
            <path d="m10 1.6 2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.7-5 2.7 1-5.6-4.1-4 5.6-.8L10 1.6Z" />
          </svg>

          <div class="relative h-4 w-4">
            <!-- empty/star background -->
            <svg class="absolute h-4 w-4 fill-slate-600" viewBox="0 0 20 20">
              <path d="m10 1.6 2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.7-5 2.7 1-5.6-4.1-4 5.6-.8L10 1.6Z" />
            </svg>

            <div class="absolute left-0 top-0 h-4 w-2 overflow-hidden">
              <svg class="h-4 w-4 fill-orange-500" viewBox="0 0 20 20">
                <path d="m10 1.6 2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.7-5 2.7 1-5.6-4.1-4 5.6-.8L10 1.6Z" />
              </svg>
            </div>
          </div>
        </div>

        <span class="text-sm font-medium text-white">{{ testimonials.ratingLabel }}</span>
      </div>

      <a class="mt-4 inline-flex items-center justify-center rounded-md border border-white/15 bg-white/10 px-4 py-3 text-sm font-semibold text-white transition hover:border-cyan-200/40 hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950"
        [href]="maps.MAPS_URL" target="_blank" rel="noreferrer">
        {{ testimonials.sourceLabel }}
      </a>
    </div>

    <div class="grid gap-4 md:grid-cols-3">
      <article *ngFor="let testimonial of testimonials.testimonials"
        class="flex min-h-[19rem] flex-col justify-between rounded-lg border border-white/10 bg-slate-900/85 p-6 shadow-xl shadow-slate-950/20 transition duration-300 hover:-translate-y-1 hover:border-cyan-200/40">
        <div>
          <div class="mb-6 flex items-center justify-between gap-4">
            <span
              class="rounded bg-cyan-200/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-cyan-100">
              {{ testimonial.service }}
            </span>
            <span class="text-4xl font-semibold leading-none text-cyan-200/35">"</span>
          </div>
          <blockquote class="text-base leading-7 text-slate-200">
            {{ testimonial.quote }}
          </blockquote>
        </div>

        <footer class="mt-8 border-t border-white/10 pt-5">
          <p class="font-semibold text-white">{{ testimonial.name }}</p>
          <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-400">
            <span>{{ testimonial.detail }}</span>
            <a class="font-medium text-cyan-200 transition hover:text-cyan-100" [href]="maps.MAPS_URL" target="_blank"
              rel="noreferrer">
              Google Maps
            </a>
          </div>
        </footer>
      </article>
    </div>
  </div>
</section>
