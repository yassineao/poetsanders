<section
  class="relative overflow-hidden border-y border-white/10 bg-slate-900/70 px-4 py-16 sm:px-6 lg:px-8 lg:py-20"
>
  <div
    class="pointer-events-none absolute -left-24 top-0 h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl"
  ></div>

  <div class="relative mx-auto grid max-w-7xl gap-10 lg:grid-cols-[0.75fr_1.25fr] lg:gap-16">
    <div class="lg:pt-3">
      <p class="text-xs font-bold uppercase tracking-[0.22em] text-cyan-300">{{ faq.eyebrow }}</p>
      <h2 class="mt-4 text-3xl font-bold tracking-tight text-white sm:text-4xl">
        {{ faq.heading }}
      </h2>
      <p class="mt-5 max-w-xl leading-7 text-slate-400">{{ faq.description }}</p>

      <a
        routerLink="/faq"
        class="mt-7 inline-flex min-h-11 items-center gap-2 rounded-xl border border-cyan-300/20 bg-cyan-300/10 px-5 text-sm font-bold text-cyan-200 transition hover:border-cyan-300/35 hover:bg-cyan-300/15 hover:text-cyan-100"
      >
        {{ faq.eyebrow }}
        <svg
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"></path>
        </svg>
      </a>
    </div>

    <div class="space-y-3">
      <article
        *ngFor="let item of faq.items | slice: 0 : 3; let index = index"
        class="overflow-hidden rounded-2xl border bg-slate-950/50 transition"
        [ngClass]="
          openItem() === index ? 'border-cyan-300/25' : 'border-white/10 hover:border-white/20'
        "
      >
        <h3>
          <button
            type="button"
            class="flex w-full items-center gap-4 px-5 py-5 text-left outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-cyan-300"
            [attr.aria-expanded]="openItem() === index"
            [attr.aria-controls]="'home-faq-answer-' + index"
            (click)="toggleItem(index)"
          >
            <span
              class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-cyan-300/10 text-xs font-bold text-cyan-300"
            >
              {{ index + 1 }}
            </span>
            <span class="flex-1 font-semibold text-white">{{ item.question }}</span>
            <svg
              class="h-4 w-4 shrink-0 text-cyan-300 transition-transform duration-300"
              [ngClass]="openItem() === index ? 'rotate-180' : ''"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
        </h3>

        <div
          [id]="'home-faq-answer-' + index"
          class="grid transition-all duration-300"
          [ngClass]="
            openItem() === index ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'
          "
        >
          <div class="overflow-hidden">
            <p
              class="border-t border-white/10 px-5 py-4 pl-[4.25rem] text-sm leading-6 text-slate-400"
            >
              {{ item.answer }}
            </p>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
