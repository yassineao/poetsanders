<section class="relative overflow-hidden rounded-lg border border-white/10 bg-slate-950 shadow-2xl shadow-slate-950/40">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-64 bg-[radial-gradient(circle_at_top_left,_rgba(34,211,238,0.16),transparent_58%)]"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-cyan-200/50 to-transparent"></div>

  <div class="relative grid gap-6 p-4 sm:p-6 lg:grid-cols-[minmax(0,1.35fr)_minmax(340px,0.65fr)] lg:p-8">
    <div class="relative min-h-[30rem] overflow-hidden rounded-lg border border-white/10 bg-slate-900 shadow-xl shadow-black/20">
      <iframe
        width="100%"
        height="100%"
        class="absolute inset-0 h-full w-full"
        frameborder="0"
        title="map"
        marginheight="0"
        marginwidth="0"
        scrolling="no"
        [src]="mapSrc"
        style="filter: grayscale(1) contrast(1.12) brightness(0.72);"
      ></iframe>
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>

      <div class="absolute inset-x-4 bottom-4 grid gap-3 sm:inset-x-6 sm:bottom-6 md:grid-cols-3">
        <div class="rounded-md border border-white/10 bg-slate-950/90 p-4 shadow-lg shadow-black/30 backdrop-blur-xl md:col-span-1">
          <p class="text-xs font-semibold uppercase tracking-[0.22em] text-cyan-200">{{ maps.ADDRESS_LABEL }}</p>
          <p class="mt-3 text-sm leading-6 text-slate-100">{{ maps.ADDRESS_DETAILS }}</p>
        </div>

        <div class="rounded-md border border-white/10 bg-slate-950/90 p-4 shadow-lg shadow-black/30 backdrop-blur-xl md:col-span-2">
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.22em] text-cyan-200">{{ maps.EMAIL_LABEL }}</p>
              <a class="mt-3 block break-words text-sm font-medium leading-6 text-white transition hover:text-cyan-200" [href]="'mailto:' + maps.EMAIL">
                {{ maps.EMAIL }}
              </a>
            </div>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.22em] text-cyan-200">{{ maps.PHONE_LABEL }}</p>
              <a class="mt-3 block text-sm font-medium leading-6 text-white transition hover:text-cyan-200" [href]="'tel:' + maps.PHONE">
                {{ maps.PHONE }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside class="rounded-lg border border-white/10 bg-white/[0.04] p-5 shadow-xl shadow-black/20 backdrop-blur sm:p-6">
      <p class="text-xs font-semibold uppercase tracking-[0.24em] text-cyan-200">Contact</p>
      <h2 class="mt-4 text-2xl font-semibold tracking-tight text-white">{{ maps.FEEDBACK_LABEL }}</h2>
      <p class="mt-3 text-sm leading-6 text-slate-300">{{ maps.FeedbackText }}</p>

      <form class="mt-6 space-y-4" novalidate>
        <div>
          <label for="name" class="mb-2 block text-sm font-medium text-slate-200">{{ maps.NAME_LABEL }}</label>
          <input
            type="text"
            id="name"
            name="name"
            class="h-11 w-full rounded-md border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-200/70 focus:ring-2 focus:ring-cyan-200/20"
          />
        </div>

        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-200">{{ maps.EMAIL_LABEL_FORM }}</label>
          <input
            type="email"
            id="email"
            name="email"
            class="h-11 w-full rounded-md border border-white/10 bg-slate-950/70 px-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-200/70 focus:ring-2 focus:ring-cyan-200/20"
          />
        </div>

        <div>
          <label for="message" class="mb-2 block text-sm font-medium text-slate-200">{{ maps.MESSAGE_LABEL }}</label>
          <textarea
            id="message"
            name="message"
            class="h-36 w-full resize-none rounded-md border border-white/10 bg-slate-950/70 px-3 py-3 text-sm leading-6 text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-200/70 focus:ring-2 focus:ring-cyan-200/20"
          ></textarea>
        </div>

        <button type="submit" class="inline-flex h-11 w-full items-center justify-center rounded-md border border-cyan-200 bg-cyan-200 px-5 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-950/20 transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-2 focus:ring-offset-slate-950">
          {{ maps.SUBMIT_LABEL }}
        </button>
      </form>

      <p class="mt-4 text-xs leading-5 text-slate-500">{{ maps.DISCLAIMER_LABEL }}</p>
    </aside>
  </div>
</section>
