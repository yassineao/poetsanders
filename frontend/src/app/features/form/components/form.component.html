<section class="bg-slate-950 px-4 py-16 text-slate-100 sm:px-6 lg:px-8 lg:py-24">
  <div class="mx-auto max-w-7xl">
    <div class="max-w-3xl">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-cyan-200">
        {{ copy().eyebrow }}
      </p>
      <h1 class="mt-4 text-4xl font-bold tracking-tight text-white sm:text-5xl">
        {{ copy().heading }}
      </h1>
      <p class="mt-5 text-lg leading-8 text-slate-300">{{ copy().description }}</p>
    </div>

    <app-booking-confirmation
      *ngIf="submitted() && confirmation() as bookingConfirmation"
      [confirmation]="bookingConfirmation"
      (startAnother)="startAnotherBooking()"
    />

    <form
      *ngIf="!submitted()"
      class="mt-12 grid gap-8 lg:grid-cols-[0.9fr_1.1fr]"
      [formGroup]="bookingForm"
      (ngSubmit)="submit()"
    >
      <app-booking-details
        [form]="bookingForm"
        [isAuthenticated]="isAuthenticated()"
        [bookingMode]="bookingMode()"
        [treatments]="treatments()"
        [selectedServiceSlugs]="selectedServiceSlugs()"
        [selectedTreatmentNames]="selectedTreatmentNames()"
        [appointmentRequired]="appointmentRequired()"
        [guestRegistrationMode]="guestRegistrationMode()"
        (bookingModeChange)="setBookingMode($event)"
        (guestRegistrationSelected)="startGuestRegistration()"
        (guestRegistrationCancelled)="cancelGuestRegistration()"
        (treatmentToggled)="toggleTreatment($event)"
      />

      <app-booking-schedule
        [monthLabel]="monthLabel()"
        [calendarDays]="calendarDays()"
        [selectedDate]="selectedDate()"
        [selectedTime]="selectedTime()"
        [selectedAppointmentLabel]="selectedAppointmentLabel()"
        [attemptedSubmit]="attemptedSubmit()"
        [submitting]="submitting()"
        [errorMessage]="errorMessage()"
        [appointmentRequired]="appointmentRequired()"
        [guestRegistrationMode]="guestRegistrationMode()"
        [submitLabel]="submitLabel()"
        [submittingLabel]="submittingLabel()"
        (previousMonth)="previousMonth()"
        (nextMonth)="nextMonth()"
        (dateSelected)="selectDate($event)"
        (timeSelected)="selectTime($event)"
      />
    </form>
  </div>
</section>
