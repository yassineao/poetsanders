<section class="relative isolate overflow-hidden">
  <img
    [src]="treatment.image"
    [alt]="treatment.title"
    class="absolute inset-0 -z-20 h-full w-full object-cover opacity-40"
  />
  <div class="absolute inset-0 -z-10 bg-gradient-to-r from-slate-950 via-slate-950/95 to-slate-950/60"></div>

  <div class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8 lg:py-28">
    <a routerLink="/services" class="inline-flex items-center gap-2 text-sm font-semibold text-cyan-200 hover:text-cyan-50">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m15 19-7-7 7-7" />
      </svg>
      {{ copy.backLabel }}
    </a>

    <p class="mt-10 text-sm font-semibold uppercase tracking-[0.22em] text-cyan-200">{{ copy.eyebrow }}</p>
    <h1 class="mt-4 max-w-4xl text-4xl font-bold tracking-tight text-white sm:text-5xl lg:text-6xl">
      {{ treatment.title }}
    </h1>
    <p class="mt-6 max-w-3xl text-lg leading-8 text-slate-200">{{ treatment.longDescription }}</p>
    <a
      [routerLink]="copy.bookLink"
      class="mt-8 inline-flex items-center justify-center rounded-md bg-cyan-200 px-6 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-100"
    >
      {{ copy.bookLabel }}
    </a>
  </div>
</section>
