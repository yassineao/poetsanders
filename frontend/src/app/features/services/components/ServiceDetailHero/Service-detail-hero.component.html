<section class="relative isolate overflow-hidden bg-slate-950 text-slate-100">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_85%_25%,rgba(103,232,249,0.12),transparent_36%)]"></div>

  <div class="relative mx-auto grid max-w-7xl items-center gap-8 px-4 py-7 sm:gap-10 sm:px-6 sm:py-12 lg:grid-cols-[0.9fr_1.1fr] lg:gap-14 lg:px-8 lg:py-16">
    <div class="min-w-0">
      <a routerLink="/services" class="inline-flex min-h-11 items-center gap-2 rounded-lg pr-3 text-sm font-semibold text-cyan-200 transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-200">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m15 19-7-7 7-7" />
        </svg>
        {{ copy.backLabel }}
      </a>

      <div class="mt-5 flex flex-wrap items-center gap-3 sm:mt-8">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-cyan-200 sm:text-sm">{{ copy.eyebrow }}</p>
        @if (treatment.details; as details) {
          <div class="inline-flex items-center gap-2 rounded-lg border border-cyan-100/25 bg-cyan-200 px-3 py-2 text-slate-950 shadow-lg shadow-cyan-950/20 sm:gap-3 sm:px-4">
            <span class="text-[0.6rem] font-bold uppercase tracking-[0.12em] opacity-70 sm:text-xs sm:tracking-[0.16em]">{{ details.priceLabel }}</span>
            <strong class="text-lg leading-none sm:text-2xl">{{ details.price }}</strong>
          </div>
        }
      </div>

      <h1 class="mt-4 max-w-2xl text-3xl font-black leading-tight tracking-tight text-white sm:mt-5 sm:text-5xl lg:text-6xl">
        {{ treatment.title }}
      </h1>
      <p class="mt-4 max-w-2xl text-sm leading-6 text-slate-300 sm:mt-6 sm:text-lg sm:leading-8">
        {{ treatment.longDescription }}
      </p>
      <a
        [routerLink]="copy.bookLink"
        class="mt-6 inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-lg bg-cyan-200 px-6 py-3 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/25 transition hover:-translate-y-0.5 hover:bg-cyan-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-100 sm:mt-8 sm:w-auto"
      >
        {{ copy.bookLabel }}
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" /></svg>
      </a>
    </div>

    <figure class="mx-auto w-full max-w-xl overflow-hidden rounded-2xl border border-white/10 bg-slate-900 shadow-2xl shadow-black/40 lg:ml-auto">
      @if (hasComparison()) {
      <div class="relative aspect-[3/4] overflow-hidden">
        <img
          [src]="comparisonImage()"
          [alt]="treatment.title + ' — ' + copy.afterLabel"
          class="absolute -left-full top-0 h-full w-[200%] max-w-none object-fill"
          draggable="false"
        />

        <img
          [src]="comparisonImage()"
          [alt]="treatment.title + ' — ' + copy.beforeLabel"
          class="absolute left-0 top-0 h-full w-[200%] max-w-none object-fill"
          [style.clip-path]="'inset(0 ' + (100 - comparison() / 2) + '% 0 0)'"
          draggable="false"
        />

        <span class="pointer-events-none absolute left-3 top-3 z-10 rounded-md border border-white/15 bg-slate-950/75 px-2.5 py-1.5 text-[0.65rem] font-bold uppercase tracking-[0.16em] text-white shadow backdrop-blur sm:left-4 sm:top-4 sm:text-xs">
          {{ copy.beforeLabel }}
        </span>
        <span class="pointer-events-none absolute right-3 top-3 z-10 rounded-md border border-white/15 bg-slate-950/75 px-2.5 py-1.5 text-[0.65rem] font-bold uppercase tracking-[0.16em] text-white shadow backdrop-blur sm:right-4 sm:top-4 sm:text-xs">
          {{ copy.afterLabel }}
        </span>

        <span class="pointer-events-none absolute inset-y-0 z-10 w-0.5 bg-white shadow-[0_0_12px_rgba(0,0,0,0.65)]" [style.left.%]="comparison()">
          <span class="absolute left-1/2 top-1/2 grid h-11 w-11 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full border-2 border-white bg-cyan-300 text-slate-950 shadow-xl">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m9 5-7 7 7 7m6-14 7 7-7 7" /></svg>
          </span>
        </span>

        <input
          type="range"
          min="0"
          max="100"
          step="1"
          [value]="comparison()"
          (input)="updateComparison($event)"
          [attr.aria-label]="copy.comparisonLabel"
          class="absolute inset-0 z-20 h-full w-full cursor-col-resize opacity-0 focus-visible:opacity-100 focus-visible:outline focus-visible:outline-4 focus-visible:outline-cyan-200"
        />
      </div>
      <figcaption class="flex items-center justify-between gap-3 border-t border-white/10 bg-slate-950 px-3 py-2.5 text-[0.65rem] font-semibold uppercase tracking-[0.14em] text-slate-400 sm:px-4 sm:text-xs">
        <span>{{ copy.beforeLabel }}</span>
        <span class="text-center normal-case tracking-normal text-slate-500">{{ copy.comparisonLabel }}</span>
        <span>{{ copy.afterLabel }}</span>
      </figcaption>
      } @else {
        <div class="relative aspect-[4/3] overflow-hidden">
          <img [src]="treatment.image" [alt]="treatment.title" class="absolute inset-0 h-full w-full object-cover" />
        </div>
      }
    </figure>
  </div>
</section>
