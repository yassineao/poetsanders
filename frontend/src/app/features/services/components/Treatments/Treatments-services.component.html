<section class="bg-slate-900 px-4 py-16 text-slate-100 sm:px-6 lg:px-8 lg:py-24">
  <div class="mx-auto max-w-7xl">
    <div class="grid gap-8 lg:grid-cols-[0.9fr_1.1fr] lg:items-end">
      <div>
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.22em] text-cyan-200">
          {{ treatments.eyebrow }}
        </p>
        <h2 class="max-w-2xl text-3xl font-bold leading-tight text-white sm:text-4xl lg:text-5xl">
          {{ treatments.heading }}
        </h2>
      </div>
      <p class="max-w-2xl text-base leading-7 text-slate-300 lg:ml-auto lg:text-lg">
        {{ treatments.description }}
      </p>
    </div>

    <div class="mt-12 grid gap-8 md:grid-cols-2">
      <article
        *ngFor="let treatment of treatments.items"
        class="group relative overflow-hidden rounded-lg border border-white/10 bg-slate-950 p-px shadow-sm transition duration-300 hover:scale-[1.02] hover:shadow-xl hover:shadow-cyan-950/30"
      >
        <span class="absolute bottom-0 left-0 h-1 w-full origin-left scale-x-0 bg-cyan-300 transition-transform duration-300 group-hover:scale-x-100"></span>
        <span class="absolute bottom-0 left-0 h-full w-1 origin-bottom scale-y-0 bg-cyan-300 transition-transform duration-300 group-hover:scale-y-100"></span>
        <span class="absolute left-0 top-0 h-1 w-full origin-right scale-x-0 bg-cyan-300 transition-transform duration-300 group-hover:scale-x-100"></span>
        <span class="absolute bottom-0 right-0 h-full w-1 origin-top scale-y-0 bg-cyan-300 transition-transform duration-300 group-hover:scale-y-100"></span>

        <div class="relative flex h-full flex-col rounded-[0.45rem] bg-slate-950/95 p-5 lg:flex-row lg:items-center">
          <div class="mb-6 shrink-0 lg:mb-0 lg:mr-6">
            <div class="relative h-24 w-24 overflow-hidden rounded-full border border-cyan-200/20 bg-cyan-200/10 lg:h-32 lg:w-32">
              <img
                [src]="treatment.image"
                [alt]="treatment.title"
                class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
              />
            </div>
          </div>

          <div class="flex flex-1 flex-col self-stretch">
            <div class="flex-1">
              <h3 class="text-xl font-semibold leading-6 text-white">{{ treatment.title }}</h3>
              <p class="mt-3 text-sm leading-6 text-slate-300">{{ treatment.description }}</p>

              <p class="mt-5 text-xs font-semibold uppercase tracking-[0.18em] text-cyan-200">
                {{ treatments.includedLabel }}
              </p>
              <ul class="mt-3 flex flex-wrap gap-2">
                <li
                  *ngFor="let service of treatment.services"
                  class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-slate-200"
                >
                  {{ service }}
                </li>
              </ul>
            </div>

            <a
              [routerLink]="['/services', treatment.slug]"
              class="mt-5 inline-flex w-fit items-center gap-2 text-sm font-semibold text-cyan-200 transition-colors duration-200 hover:text-cyan-50"
            >
              {{ treatments.detailLinkLabel }}
              <svg class="h-4 w-4 transition-transform duration-200 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7" />
              </svg>
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
