<section class="bg-slate-950 px-4 py-16 text-slate-100 sm:px-6 lg:px-8 lg:py-24">
  <div class="mx-auto max-w-7xl">
    <div class="grid gap-10 lg:grid-cols-[0.9fr_1.1fr] lg:items-end">
      <div>
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.22em] text-cyan-200">
          {{ features.eyebrow }}
        </p>
        <h2 class="max-w-2xl text-3xl font-bold leading-tight text-white sm:text-4xl lg:text-5xl">
          {{ features.heading }}
        </h2>
      </div>
      <p class="max-w-2xl text-base leading-7 text-slate-300 lg:ml-auto lg:text-lg">
        {{ features.description }}
      </p>
    </div>

    <div class="mt-12 grid gap-4 sm:grid-cols-2 lg:mt-16 lg:grid-cols-4">
      <article
        *ngFor="let item of features.items"
        class="group rounded-md border border-white/10 bg-white/[0.04] p-6 shadow-xl shadow-slate-950/20 transition duration-300 hover:-translate-y-1 hover:border-cyan-200/40 hover:bg-white/[0.07]"
      >
        <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-md border border-cyan-200/25 bg-cyan-200/10 text-cyan-100">
          <svg
            *ngIf="item.icon === 'sparkle'"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 16l.9 2.1L8 19l-2.1.9L5 22l-.9-2.1L2 19l2.1-.9L5 16Z" />
          </svg>
          <svg
            *ngIf="item.icon === 'shield'"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v5c0 4.6-2.9 8.6-7 10-4.1-1.4-7-5.4-7-10V6l7-3Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-5" />
          </svg>
          <svg
            *ngIf="item.icon === 'clock'"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v5l3 2" />
          </svg>
          <svg
            *ngIf="item.icon === 'drop'"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3s6 6.2 6 11a6 6 0 0 1-12 0c0-4.8 6-11 6-11Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 15.5A3.5 3.5 0 0 0 13 19" />
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-white">
          {{ item.title }}
        </h3>
        <p class="mt-3 text-sm leading-6 text-slate-300">
          {{ item.body }}
        </p>
      </article>
    </div>
  </div>
</section>
