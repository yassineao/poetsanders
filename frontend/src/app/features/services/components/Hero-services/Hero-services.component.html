<section class="relative overflow-hidden bg-slate-900 px-4 py-12 text-slate-100 sm:px-6 lg:px-8 lg:py-16">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_85%_35%,rgba(103,232,249,0.14),transparent_32%)]"></div>
  <div class="relative mx-auto grid max-w-7xl items-center gap-8 lg:grid-cols-[1.15fr_0.85fr] lg:gap-12">
    <div>
      <p *ngIf="hero.announcement" class="mb-4 text-xs font-bold uppercase tracking-[0.24em] text-cyan-200">
      {{ hero.announcement }}
      </p>
      <h1 class="mb-4 max-w-4xl text-3xl font-bold leading-[0.95] tracking-tighter text-white sm:text-5xl lg:text-7xl">
        {{ hero.title }}
      </h1>
      <p class="max-w-2xl text-base leading-7 text-slate-300 sm:text-lg">
        {{ hero.description }}
      </p>
      <div class="mt-5 flex flex-col gap-3 sm:flex-row lg:mt-7">
        <button
          type="button"
          class="inline-flex h-11 w-full items-center justify-center rounded-md bg-cyan-200 px-7 text-sm font-bold text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-200 sm:w-auto"
        >
          {{ hero.ctaPrimary }}
        </button>
        <button
          type="button"
          class="inline-flex h-11 w-full items-center justify-center rounded-md border border-white/15 bg-white/[0.04] px-7 text-sm font-bold text-slate-100 transition hover:border-cyan-200/40 hover:bg-white/[0.08] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-200 sm:w-auto"
        >
          <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="10 8 16 12 10 16 10 8"></polygon>
          </svg>
          {{ hero.ctaSecondary }}
        </button>
      </div>
    </div>

    <div class="relative mx-auto w-full max-w-xs lg:ml-auto">
      <div class="absolute -inset-3 rounded-2xl bg-cyan-300/10 blur-2xl"></div>
      <div class="relative overflow-hidden rounded-2xl border border-cyan-200/20 bg-slate-950/70 p-3 shadow-2xl shadow-slate-950/50 backdrop-blur sm:p-5">
        <div class="absolute inset-0 bg-gradient-to-br from-cyan-300/10 via-transparent to-slate-950/40"></div>
        <div class="relative flex aspect-square items-center justify-center rounded-xl border border-white/10 bg-white/[0.04]">
          <img
            src="/logo-poets-website-1_high_resolution.png"
            alt="Poets Anders"
            class="h-20 w-20 object-contain drop-shadow-[0_0_24px_rgba(103,232,249,0.3)] transition duration-500 hover:scale-105 sm:h-28 sm:w-28"
          />
        </div>
        <div class="relative mt-3 flex items-center justify-between gap-3 text-[9px] font-semibold uppercase tracking-[0.12em] text-cyan-200">
          <span>Poets Anders</span>
          <span class="text-slate-500">Dutch Car Care</span>
        </div>
      </div>
    </div>
  </div>
</section>
