<section class="relative isolate overflow-hidden bg-slate-950 px-4 py-10 text-slate-100 sm:px-6 sm:py-16 lg:px-8 lg:py-24">
  <img src="/beautiful-car-washing-service.jpg" alt="" aria-hidden="true" class="absolute inset-0 -z-20 h-full w-full object-cover opacity-25" />
  <div class="absolute inset-0 -z-10 bg-gradient-to-r from-slate-950 via-slate-950/90 to-slate-950/55"></div>
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_85%_35%,rgba(103,232,249,0.16),transparent_32%)]"></div>
  <div class="relative mx-auto grid max-w-7xl items-center gap-8 lg:grid-cols-[1.2fr_0.8fr] lg:gap-16">
    <div>
      <p *ngIf="hero.announcement" class="mb-4 inline-flex rounded-full border border-cyan-200/20 bg-cyan-200/10 px-3 py-1.5 text-[0.65rem] font-bold uppercase tracking-[0.18em] text-cyan-100 sm:text-xs">
        {{ hero.announcement }}
      </p>
      <h1 class="max-w-4xl text-4xl font-bold leading-[1.02] tracking-tight text-white sm:text-5xl lg:text-7xl">
        {{ hero.title }}
      </h1>
      <p class="mt-4 max-w-2xl text-sm leading-6 text-slate-300 sm:mt-6 sm:text-lg sm:leading-8">
        {{ hero.description }}
      </p>
      <div class="mt-6 flex flex-col gap-3 sm:mt-8 sm:flex-row">
        <a
          routerLink="/book"
          class="inline-flex min-h-12 w-full items-center justify-center rounded-md bg-cyan-200 px-6 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/25 transition hover:-translate-y-0.5 hover:bg-cyan-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-200 sm:w-auto sm:px-7"
        >
          {{ hero.ctaPrimary }}
        </a>
        <a
          href="#treatments"
          class="inline-flex min-h-12 w-full items-center justify-center rounded-md border border-white/15 bg-white/[0.04] px-6 text-sm font-bold text-slate-100 transition hover:border-cyan-200/40 hover:bg-white/[0.08] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-200 sm:w-auto sm:px-7"
        >
          <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" /></svg>
          {{ hero.ctaSecondary }}
        </a>
      </div>
    </div>

    <div class="hidden lg:block">
      <div class="relative ml-auto max-w-md rounded-2xl border border-white/15 bg-slate-950/65 p-6 shadow-2xl shadow-black/40 backdrop-blur-md">
        <div class="flex items-center gap-4">
          <span class="grid h-14 w-14 shrink-0 place-items-center rounded-xl border border-cyan-200/25 bg-cyan-200/10">
            <img src="/logo-poets-website-1_high_resolution.png" alt="Poets Anders" class="h-10 w-10 object-contain" />
          </span>
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-cyan-200">Poets Anders</p>
            <p class="mt-1 text-lg font-semibold text-white">Dutch Car Care</p>
          </div>
        </div>
        <div class="mt-6 h-px bg-gradient-to-r from-cyan-200/40 to-transparent"></div>
        <p class="mt-5 text-sm leading-6 text-slate-300">{{ hero.description }}</p>
      </div>
    </div>
  </div>
</section>
