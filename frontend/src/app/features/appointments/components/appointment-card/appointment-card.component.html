<article
  class="h-full rounded-2xl border border-white/10 bg-slate-900/70 p-5 shadow-lg shadow-slate-950/20 sm:p-6"
>
  <div class="flex items-start gap-4">
    <span
      class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-cyan-300/10 text-cyan-300"
    >
      <svg
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 2v3M16 2v3M3.5 9h17M5 4.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z"
        ></path>
      </svg>
    </span>

    <div class="min-w-0 flex-1">
      <div class="flex flex-col items-start gap-2 sm:flex-row sm:justify-between">
        <time
          class="font-semibold capitalize text-white"
          [attr.datetime]="appointment.localDateTime"
        >
          {{ appointment.label }}
        </time>

        <span
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-bold"
          [ngClass]="{
            'border-emerald-300/25 bg-emerald-300/10 text-emerald-200':
              appointment.acceptanceStatus === 'accepted',
            'border-amber-300/25 bg-amber-300/10 text-amber-200':
              appointment.acceptanceStatus === 'pending',
            'border-cyan-300/25 bg-cyan-300/10 text-cyan-200':
              appointment.acceptanceStatus === 'partial',
          }"
        >
          <svg
            *ngIf="appointment.acceptanceStatus === 'accepted'"
            class="h-3.5 w-3.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"></path>
          </svg>
          <svg
            *ngIf="appointment.acceptanceStatus === 'pending'"
            class="h-3.5 w-3.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            ></path>
          </svg>
          {{
            appointment.acceptanceStatus === 'accepted'
              ? copy().acceptedLabel
              : appointment.acceptanceStatus === 'partial'
                ? copy().partiallyAcceptedLabel
                : copy().pendingLabel
          }}
        </span>
      </div>

      <div class="mt-3 flex flex-wrap gap-2">
        <span
          *ngFor="let treatmentName of appointment.treatmentNames"
          class="rounded-full bg-cyan-300/10 px-3 py-1 text-xs font-semibold text-cyan-100"
        >
          {{ treatmentName }}
        </span>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="mt-5 inline-flex min-h-10 items-center rounded-lg border border-rose-300/20 bg-rose-300/10 px-4 text-sm font-semibold text-rose-100 transition hover:bg-rose-300/20 disabled:cursor-wait disabled:opacity-60"
    [disabled]="isCancelling"
    (click)="cancelled.emit()"
  >
    {{ isCancelling ? copy().cancellingLabel : copy().cancelLabel }}
  </button>
</article>
