<section
  *ngIf="isAuthenticated()"
  class="relative overflow-hidden border-b border-white/10 bg-slate-950 px-4 sm:px-6 lg:px-8"
  [ngClass]="pageMode ? 'py-16 lg:py-24' : 'py-12'"
>
  <div
    class="pointer-events-none absolute left-1/4 top-0 h-64 w-64 rounded-full bg-cyan-400/10 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-cyan-300">
          {{ copy().eyebrow }}
        </p>
        <h2 class="mt-3 text-3xl font-bold text-white">{{ copy().heading }}</h2>
        <p class="mt-3 text-slate-400">{{ copy().description }}</p>
      </div>
      <a
        *ngIf="!pageMode"
        routerLink="/appointments"
        class="inline-flex min-h-11 w-fit items-center gap-2 rounded-xl border border-white/10 bg-white/[0.04] px-5 text-sm font-bold text-white transition hover:border-cyan-300/25 hover:bg-white/[0.08]"
      >
        {{ copy().profileLabel }}
        <svg
          class="h-4 w-4 text-cyan-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"></path>
        </svg>
      </a>
    </div>

    <p *ngIf="loading()" class="mt-6 text-sm text-slate-400">{{ copy().loadingLabel }}</p>

    <p
      *ngIf="hasError()"
      role="alert"
      class="mt-6 rounded-xl border border-rose-300/20 bg-rose-300/10 p-4 text-sm text-rose-100"
    >
      {{ copy().errorLabel }}
    </p>

    <div
      *ngIf="!loading() && !hasError() && !appointments().length"
      class="mt-6 rounded-2xl border border-white/10 bg-slate-900/60 p-6 text-sm text-slate-400"
    >
      {{ copy().emptyLabel }}
    </div>

    <div *ngIf="appointments().length" class="mt-7 grid gap-4 lg:grid-cols-2">
      <app-appointment-card
        *ngFor="let appointment of appointments()"
        [appointment]="appointment"
        [isCancelling]="isCancelling(appointment.ids)"
        (cancelled)="cancelAppointment(appointment.ids)"
      />
    </div>
  </div>
</section>
