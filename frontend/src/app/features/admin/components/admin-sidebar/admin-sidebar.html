<div class="sticky top-0 z-40 border-b border-white/10 bg-slate-950 px-4 py-3 md:hidden">
  <div class="flex items-center justify-between gap-4">
    <a routerLink="/" class="text-sm font-bold text-white">Poets Anders Admin</a>
    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-lg border border-white/10 text-slate-200 transition hover:bg-white/5"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-mobile-navigation"
      aria-label="Toggle admin navigation"
      (click)="menuOpen.set(!menuOpen())"
    >
      @if (menuOpen()) {
        <span aria-hidden="true" class="text-2xl leading-none">&times;</span>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="admin-mobile-navigation" aria-label="Admin navigation" class="mt-3 border-t border-white/10 pt-3">
      <ng-container *ngTemplateOutlet="navigation" />
    </nav>
  }
</div>

<aside class="hidden h-screen w-64 shrink-0 border-r border-white/10 bg-slate-950 md:sticky md:top-0 md:flex md:flex-col">
  <div class="border-b border-white/10 px-5 py-6">
    <a routerLink="/" class="block focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300">
      <span class="block text-lg font-bold text-white">Poets Anders</span>
      <span class="mt-1 block text-xs font-semibold uppercase text-cyan-300">Admin</span>
    </a>
  </div>

  <nav aria-label="Admin navigation" class="flex-1 overflow-y-auto px-3 py-5">
    <ng-container *ngTemplateOutlet="navigation" />
  </nav>

  <div class="border-t border-white/10 p-3">
    <button
      type="button"
      class="flex min-h-11 w-full items-center gap-3 rounded-lg px-3 text-left text-sm font-semibold text-slate-300 transition hover:bg-white/5 hover:text-white disabled:cursor-wait disabled:opacity-60"
      [disabled]="loggingOut()"
      (click)="logout()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5M15 12H3m12-9h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" />
      </svg>
      <span>{{ loggingOut() ? '...' : sidebar().logout }}</span>
    </button>
  </div>
</aside>

<ng-template #navigation>
  <ul class="space-y-1">
    @for (item of sidebar().items; track item.table) {
      <li>
        <button
          type="button"
          class="flex min-h-11 w-full items-center gap-3 rounded-lg px-3 text-left text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300"
          [class.bg-cyan-300]="activeSection() === item.table"
          [class.text-slate-950]="activeSection() === item.table"
          [class.text-slate-300]="activeSection() !== item.table"
          [class.hover:bg-white/5]="activeSection() !== item.table"
          [class.hover:text-white]="activeSection() !== item.table"
          [attr.aria-current]="activeSection() === item.table ? 'page' : null"
          (click)="selectSection(item.table)"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16M4 12h16M4 19h16" />
          </svg>
          <span>{{ item.name }}</span>
        </button>
      </li>
    }
  </ul>

  <button
    type="button"
    class="mt-3 flex min-h-11 w-full items-center gap-3 rounded-lg px-3 text-left text-sm font-semibold text-slate-300 transition hover:bg-white/5 hover:text-white disabled:cursor-wait disabled:opacity-60 md:hidden"
    [disabled]="loggingOut()"
    (click)="logout()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5M15 12H3m12-9h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" />
    </svg>
    <span>{{ loggingOut() ? '...' : sidebar().logout }}</span>
  </button>
</ng-template>
