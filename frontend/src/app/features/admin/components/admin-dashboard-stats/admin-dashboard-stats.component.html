<section class="mt-10 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <article class="rounded-2xl border border-white/10 bg-slate-900/70 p-6">
    <p class="text-sm font-semibold text-slate-400">{{ copy().usersStatLabel }}</p>
    <p class="mt-3 text-4xl font-bold text-white">{{ dashboard.totalUsers }}</p>
  </article>
  <article class="rounded-2xl border border-white/10 bg-slate-900/70 p-6">
    <p class="text-sm font-semibold text-slate-400">{{ copy().appointmentsStatLabel }}</p>
    <p class="mt-3 text-4xl font-bold text-white">{{ dashboard.totalAppointments }}</p>
  </article>
  <article class="rounded-2xl border border-amber-300/20 bg-amber-300/5 p-6">
    <p class="text-sm font-semibold text-amber-200">{{ copy().pendingStatLabel }}</p>
    <p class="mt-3 text-4xl font-bold text-white">{{ dashboard.pendingAppointments }}</p>
  </article>
  <article class="rounded-2xl border border-emerald-300/20 bg-emerald-300/5 p-6">
    <p class="text-sm font-semibold text-emerald-200">{{ copy().acceptedStatLabel }}</p>
    <p class="mt-3 text-4xl font-bold text-white">{{ dashboard.acceptedAppointments }}</p>
  </article>
</section>
