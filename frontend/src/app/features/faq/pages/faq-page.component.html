<main
  class="relative min-h-screen overflow-hidden bg-slate-950 px-4 py-16 text-slate-100 sm:px-6 lg:px-8 lg:py-24"
>
  <div
    class="pointer-events-none absolute left-1/2 top-0 h-96 w-96 -translate-x-1/2 rounded-full bg-cyan-400/10 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -right-32 top-1/3 h-80 w-80 rounded-full bg-blue-500/10 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-5xl">
    <app-faq-hero [faq]="faq()" />
    <app-faq-accordion [items]="faq().items" />
    <app-faq-cta [faq]="faq()" />
  </div>
</main>
