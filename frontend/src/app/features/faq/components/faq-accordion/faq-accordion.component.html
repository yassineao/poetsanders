<section class="mt-12 space-y-3 lg:mt-16" aria-label="Frequently asked questions">
  <article
    *ngFor="let item of items; let index = index"
    class="overflow-hidden rounded-2xl border bg-slate-900/70 shadow-lg shadow-slate-950/20 transition"
    [ngClass]="
      openItem() === index ? 'border-cyan-300/25' : 'border-white/10 hover:border-white/20'
    "
  >
    <h2>
      <button
        type="button"
        class="flex w-full items-center gap-5 px-5 py-5 text-left outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-cyan-300 sm:px-7 sm:py-6"
        [attr.aria-expanded]="openItem() === index"
        [attr.aria-controls]="'faq-answer-' + index"
        (click)="toggleItem(index)"
      >
        <span
          class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-sm font-bold transition"
          [ngClass]="
            openItem() === index ? 'bg-cyan-300 text-slate-950' : 'bg-white/[0.05] text-cyan-300'
          "
        >
          {{ index + 1 }}
        </span>
        <span class="flex-1 text-base font-semibold text-white sm:text-lg">
          {{ item.question }}
        </span>
        <span
          class="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/10 text-cyan-300"
        >
          <svg
            class="h-4 w-4 transition-transform duration-300"
            [ngClass]="openItem() === index ? 'rotate-45' : ''"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M12 5v14M5 12h14"></path>
          </svg>
        </span>
      </button>
    </h2>

    <div
      [id]="'faq-answer-' + index"
      class="grid transition-all duration-300"
      [ngClass]="openItem() === index ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'"
    >
      <div class="overflow-hidden">
        <p
          class="border-t border-white/10 px-5 py-5 pl-[5.25rem] leading-7 text-slate-300 sm:px-7 sm:py-6 sm:pl-[6.25rem]"
        >
          {{ item.answer }}
        </p>
      </div>
    </div>
  </article>
</section>
