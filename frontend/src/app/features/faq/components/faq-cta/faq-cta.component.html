<section
  class="relative mt-12 overflow-hidden rounded-3xl border border-cyan-300/20 bg-gradient-to-br from-cyan-300/15 via-slate-900 to-slate-900 p-7 sm:p-10"
>
  <div
    class="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full bg-cyan-300/20 blur-3xl"
  ></div>
  <div class="relative flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
    <div class="max-w-2xl">
      <h2 class="text-2xl font-bold text-white sm:text-3xl">{{ faq.ctaHeading }}</h2>
      <p class="mt-3 leading-7 text-slate-300">{{ faq.ctaDescription }}</p>
    </div>
    <a
      routerLink="/book"
      class="inline-flex min-h-12 shrink-0 items-center justify-center gap-2 rounded-xl bg-cyan-300 px-6 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/30 transition hover:-translate-y-0.5 hover:bg-cyan-200"
    >
      {{ faq.ctaLabel }}
      <svg
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"></path>
      </svg>
    </a>
  </div>
</section>
