<header class="mx-auto max-w-3xl text-center">

  >
    {{ faq.eyebrow }}
  </span>
  <h1 class="mt-6 text-4xl font-bold tracking-tight text-white sm:text-5xl lg:text-6xl">

  <p class="mx-auto mt-6 max-w-2xl text-lg leading-8 text-slate-300">
    {{ faq.description }}
  </p>
</header>
