<div class="mt-8 border-t border-white/10 pt-8">
  <div class="flex items-end justify-between gap-4">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-200">Appointments</p>
      <h2 class="mt-2 text-2xl font-semibold text-white">Your bookings</h2>
    </div>

    <span
      *ngIf="appointments.length"
      class="rounded-full bg-cyan-200/10 px-3 py-1 text-xs font-semibold text-cyan-100"
    >
      {{ appointments.length }}
    </span>
  </div>

  <p *ngIf="loading" class="mt-5 text-sm text-slate-400">Loading appointments...</p>

  <p
    *ngIf="hasError"
    role="alert"
    class="mt-5 rounded-md border border-rose-300/20 bg-rose-300/10 p-4 text-sm text-rose-100"
  >
    Appointments could not be loaded.
  </p>

  <p
    *ngIf="!loading && !hasError && !appointments.length"
    class="mt-5 rounded-lg border border-white/10 bg-slate-950/50 p-5 text-sm text-slate-400"
  >
    You have no booked appointments yet.
  </p>

  <div *ngIf="appointments.length" class="mt-5 grid gap-4">
    <article
      *ngFor="let appointment of appointments"
      class="rounded-lg border border-white/10 bg-slate-950/50 p-5"
    >
      <time
        class="font-semibold capitalize text-white"
        [attr.datetime]="appointment.localDateTime"
      >
        {{ appointment.label }}
      </time>

      <div class="mt-3 flex flex-wrap gap-2">
        <span
          *ngFor="let treatmentName of appointment.treatmentNames"
          class="rounded-full bg-cyan-200/10 px-3 py-1 text-xs font-semibold text-cyan-100"
        >
          {{ treatmentName }}
        </span>
      </div>

      <button
        type="button"
        (click)="cancel(appointment.id)"
        [disabled]="isCancelling(appointment.id)"
        class="mt-4 inline-flex items-center rounded-md border border-white/10 bg-rose-300/10 px-3 py-1 text-sm font-medium text-rose-100 transition hover:bg-rose-300/20 focus:outline-none focus:ring-2 focus:ring-rose-300/20 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isCancelling(appointment.id) ? 'Cancelling...' : 'Cancel appointment' }}
      </button>
    </article>
  </div>
</div>
