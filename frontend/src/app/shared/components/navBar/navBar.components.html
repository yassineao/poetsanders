<header
  class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-950/85 shadow-2xl shadow-black/20 backdrop-blur-2xl">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-cyan-200/80 to-transparent"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

  <div class="mx-auto max-w-[96rem] px-4 sm:px-6 xl:px-8">
    <nav aria-label="Primary navigation" class="flex h-16 items-center justify-between gap-4 xl:h-20">
      <a routerLink="/" fragment="home"
        class="group flex min-w-0 shrink-0 items-center gap-3 rounded-lg outline-none transition focus-visible:ring-2 focus-visible:ring-cyan-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950"
        aria-label="PoetsAnders home" (click)="closeMobileMenu()">
        <span
          class="relative flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-xl border border-cyan-100/30 bg-white shadow-lg shadow-cyan-950/30 transition duration-300 group-hover:-translate-y-0.5 group-hover:shadow-cyan-500/20">
          <span class="absolute inset-0 bg-gradient-to-br from-white via-cyan-50 to-slate-200"></span>
          <img src="/logo-poets-website-1.png" alt="" class="relative h-8 w-8 object-contain" />
        </span>
        <span class="min-w-0 leading-none">
          <span class="block text-lg font-bold tracking-wide text-white sm:text-xl">Poets Anders</span>
          <span class="mt-1 hidden text-[11px] font-medium uppercase tracking-[0.22em] text-cyan-200 sm:block">Dutch Car
            Care</span>
        </span>
      </a>

      <ul class="hidden min-w-0 items-center rounded-xl border border-white/10 bg-white/[0.035] p-1.5 shadow-inner shadow-black/20 xl:flex">
        <li *ngFor="let item of navItems(); let last = last" class="relative flex items-center">
          <a [routerLink]="item.routerLink"
            routerLinkActive="bg-gradient-to-b from-cyan-200/20 to-cyan-300/10 text-cyan-50 shadow-sm ring-1 ring-cyan-100/15"
            [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
            class="relative inline-flex h-9 items-center whitespace-nowrap rounded-lg px-2.5 text-[13px] font-semibold text-slate-300 outline-none transition-all duration-200 hover:bg-white/[0.08] hover:text-white focus-visible:ring-2 focus-visible:ring-cyan-200 2xl:px-3 2xl:text-sm">
            {{ item.label }}
          </a>
          <span *ngIf="!last" class="mx-0.5 h-4 w-px bg-gradient-to-b from-transparent via-white/20 to-transparent 2xl:mx-1" aria-hidden="true"></span>
        </li>
      </ul>

      <div class="hidden shrink-0 items-center gap-2 xl:flex 2xl:gap-3">
        <div class="relative flex items-center rounded-xl border border-white/10 bg-white/[0.04] p-1 shadow-sm shadow-slate-950/20 transition-colors hover:border-cyan-100/25"
          [attr.aria-label]="copy().navbar.langLabel">

          <button type="button" (click)="language_shift_window.set(!language_shift_window())"
            class="inline-flex h-9 min-w-14 items-center justify-center gap-1.5 rounded-lg px-2.5 text-xs font-bold tracking-wider text-slate-200 outline-none transition-all duration-200 hover:bg-white/10 hover:text-white focus-visible:ring-2 focus-visible:ring-cyan-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 2xl:min-w-16 2xl:px-3 2xl:text-sm"
            [ngClass]="language_shift_window() ? 'bg-white/10 text-white shadow-sm' : ''"
            [attr.aria-expanded]="language_shift_window()">
            <span>{{ selectedLanguage() | uppercase }}</span>
            <svg class="h-4 w-4 transition-transform" [ngClass]="language_shift_window() ? 'rotate-180' : ''" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <ul *ngIf="language_shift_window()"
            class="absolute right-0 top-full mt-3 flex min-w-44 flex-col items-stretch gap-1 rounded-xl border border-white/10 bg-slate-950/95 p-2 shadow-2xl shadow-slate-950/50 ring-1 ring-cyan-100/10 backdrop-blur-xl"
            [attr.aria-label]="copy().navbar.langLabel">
            <li *ngFor="let locale of languages" class="group relative">
              <button type="button" (click)="setLanguage(locale); language_shift_window.set(false)"
                class="inline-flex h-10 w-full items-center justify-between rounded px-3 text-sm font-semibold text-slate-300 outline-none transition-all duration-200 hover:bg-white/10 hover:text-white focus-visible:ring-2 focus-visible:ring-cyan-200"
                [ngClass]="locale === selectedLanguage() ? 'bg-cyan-300/15 text-cyan-100 ring-1 ring-cyan-300/20' : ''">
                <span>{{ copy().navbar.langNames[locale] }}</span>
                <span *ngIf="locale === selectedLanguage()" class="ml-3 h-1.5 w-1.5 rounded-full bg-cyan-300"></span>
              </button>
            </li>
          </ul>

        </div>

        <a routerLink="/book"
          class="group relative inline-flex h-11 items-center justify-center gap-2 overflow-hidden rounded-xl border border-cyan-100 bg-gradient-to-b from-cyan-100 to-cyan-300 px-4 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/30 outline-none transition-all duration-300 hover:-translate-y-0.5 hover:from-white hover:to-cyan-100 hover:shadow-cyan-400/20 focus-visible:ring-2 focus-visible:ring-cyan-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 2xl:px-5">
          <span class="absolute inset-y-0 -left-8 w-8 rotate-12 bg-white/60 blur-md transition-transform duration-700 group-hover:translate-x-36"></span>
          <svg class="relative z-10 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v3M16 2v3M3.5 9h17M5 4.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z" />
          </svg>
          <span class="relative z-10">{{ copy().navbar.ctaPrimary }}</span>
        </a>
      </div>

      <button type="button"
        class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/[0.05] text-slate-200 shadow-sm outline-none transition-colors hover:border-cyan-200/30 hover:bg-white/10 hover:text-white focus-visible:ring-2 focus-visible:ring-cyan-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 xl:hidden"
        [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-navigation"
        [attr.aria-label]="copy().navbar.menuToggle" (click)="toggleMobileMenu()">
        <span class="sr-only">{{ copy().navbar.menuToggle }}</span>
        <svg *ngIf="!mobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg *ngIf="mobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </nav>

    <div id="mobile-navigation" class="grid transition-all duration-300 xl:hidden"
      [ngClass]="mobileMenuOpen() ? 'grid-rows-[1fr] pb-4 opacity-100' : 'grid-rows-[0fr] opacity-0'">
      <div class="overflow-hidden">
        <div class="border-t border-white/10 pt-4">
          <div class="grid gap-1 rounded-xl border border-white/10 bg-white/[0.04] p-2 shadow-xl shadow-slate-950/20 sm:grid-cols-2">
          <a *ngFor="let item of navItems()" [routerLink]="item.routerLink" routerLinkActive="bg-white/5 text-white"
            [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
            class="flex items-center justify-between rounded-lg px-3 py-3 text-sm font-semibold text-slate-300 transition-colors hover:bg-white/[0.08] hover:text-white"
            (click)="closeMobileMenu()">
            <span>{{ item.label }}</span>
            <svg class="h-4 w-4 text-cyan-200/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7" />
            </svg>
          </a>
          </div>

          <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-white/10 pt-3">
            <button *ngFor="let locale of languages" type="button" (click)="setLanguage(locale)"
              class="rounded-md border px-3 py-2 text-sm font-semibold outline-none transition focus-visible:ring-2 focus-visible:ring-cyan-200"
              [ngClass]="locale === selectedLanguage() ? 'border-cyan-200 bg-cyan-200 text-slate-950' : 'border-white/10 text-slate-300 hover:bg-white/5 hover:text-white'">
              {{ copy().navbar.langNames[locale] }}
            </button>
          </div>

          <a routerLink="/book"
            class="mt-3 inline-flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-cyan-100 bg-gradient-to-b from-cyan-100 to-cyan-300 px-5 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/20 transition hover:from-white hover:to-cyan-100"
            (click)="closeMobileMenu()">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v3M16 2v3M3.5 9h17M5 4.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z" />
            </svg>
            {{ copy().navbar.ctaPrimary }}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
