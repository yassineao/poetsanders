<header class="fixed top-0 z-50 w-full border-b border-white/5 bg-slate-950/80 backdrop-blur-lg">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <nav aria-label="Primary navigation" class="flex h-16 items-center justify-between lg:h-20">
      <a
        routerLink="/"
        fragment="home"
        class="group flex items-center gap-3 transition-opacity hover:opacity-90"
        aria-label="PoetsAnders home"
        (click)="closeMobileMenu()"
      >
        <span class="flex h-10 items-center px-1 sm:h-11 lg:h-12">
          <span class="text-xl font-black tracking-normal text-white sm:text-2xl">
            Poets<span class="text-sky-300">Anders</span>
          </span>
        </span>
      </a>

      <ul class="hidden items-center gap-1 lg:flex">
        <li *ngFor="let item of navItems()" class="group relative">
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="bg-white/5 text-white"
            [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
            class="inline-flex h-10 items-center rounded-lg px-4 text-sm font-medium text-slate-300 transition-colors hover:bg-white/5 hover:text-white"
          >
            {{ item.label }}
          </a>
        </li>
      </ul>

      <div class="hidden items-center gap-3 lg:flex">
        <div class="flex items-center rounded-lg border border-white/10 bg-white/[0.03] p-1" [attr.aria-label]="copy().navbar.langLabel">
          <button
            *ngFor="let locale of languages"
            type="button"
            (click)="setLanguage(locale)"
            class="inline-flex h-9 items-center rounded-md px-3 text-sm font-medium transition-colors"
            [ngClass]="locale === selectedLanguage() ? 'bg-white text-slate-950' : 'text-slate-300 hover:bg-white/5 hover:text-white'"
          >
            {{ locale | uppercase }}
          </button>
        </div>

        <a
          routerLink="/collections"
          class="group relative inline-flex h-10 items-center justify-center overflow-hidden rounded-lg border border-sky-300 bg-sky-300/10 px-5 text-sm font-semibold text-sky-200 transition-all duration-300 hover:border-sky-400 hover:bg-sky-400 hover:text-slate-950 hover:shadow-lg hover:shadow-sky-400/20"
        >
          <span class="relative z-10">{{ copy().navbar.ctaPrimary }}</span>
        </a>
      </div>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-slate-200 transition-colors hover:bg-white/5 hover:text-white lg:hidden"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-navigation"
        [attr.aria-label]="copy().navbar.menuToggle"
        (click)="toggleMobileMenu()"
      >
        <span class="sr-only">{{ copy().navbar.menuToggle }}</span>
        <svg *ngIf="!mobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg *ngIf="mobileMenuOpen()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </nav>

    <div
      id="mobile-navigation"
      class="grid transition-all duration-200 lg:hidden"
      [ngClass]="mobileMenuOpen() ? 'grid-rows-[1fr] pb-4 opacity-100' : 'grid-rows-[0fr] opacity-0'"
    >
      <div class="overflow-hidden">
        <div class="border-t border-white/10 pt-3">
          <a
            *ngFor="let item of navItems()"
            [routerLink]="item.routerLink"
            routerLinkActive="bg-white/5 text-white"
            [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
            class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-white/5 hover:text-white"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>

          <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-white/10 pt-3">
            <button
              *ngFor="let locale of languages"
              type="button"
              (click)="setLanguage(locale)"
              class="rounded-lg border px-3 py-2 text-sm font-semibold transition"
              [ngClass]="locale === selectedLanguage() ? 'border-white bg-white text-slate-950' : 'border-white/10 text-slate-300 hover:bg-white/5 hover:text-white'"
            >
              {{ copy().navbar.langNames[locale] }}
            </button>
          </div>

          <a
            routerLink="/collections"
            class="mt-3 inline-flex h-10 w-full items-center justify-center rounded-lg border border-sky-300 bg-sky-300/10 px-5 text-sm font-semibold text-sky-200 transition-colors hover:bg-sky-400 hover:text-slate-950"
            (click)="closeMobileMenu()"
          >
            {{ copy().navbar.ctaPrimary }}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
